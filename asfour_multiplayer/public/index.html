<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>عائلة ال عصفور — جماعي</title><style>
*{box-sizing:border-box}body{margin:0;background:linear-gradient(145deg,#071226,#10254b);color:white;font-family:Tahoma,Arial,sans-serif;text-align:center;min-height:100vh}main{max-width:760px;margin:auto;padding:24px 14px}h1{color:#ffda79;font-size:clamp(24px,5vw,42px)}p{line-height:1.7}.panel{background:#ffffff12;border:1px solid #ffffff30;border-radius:16px;padding:16px;margin:16px 0}button,input{font:inherit;border-radius:10px;padding:12px;border:0}button{cursor:pointer;background:#ffdb83;color:#15223a;font-weight:bold;margin:4px}button:disabled{opacity:.4;cursor:not-allowed}input{width:160px;max-width:55%;text-transform:uppercase}.board{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;max-width:540px;margin:20px auto}.tile{aspect-ratio:1;font-size:clamp(22px,5vw,36px);background:#2c4b77;color:white;border:2px solid #7893b9}.tile.g{background:#118c4a}.tile.o{background:#df791b}.tile.active{outline:3px solid #ffe48b}.hidden{display:none}.answer{background:#132b4b;padding:12px;border-radius:8px}.green{color:#72eaa6}.orange{color:#ffb979}small{color:#cad5ea}#result{white-space:pre-line;font-size:26px;font-weight:bold}#notice{color:#ffda79}</style></head><body><main><h1>🎮 عائلة ال عصفور</h1><p>🟢 الأخضر يصل من الأعلى للأسفل | 🟠 البرتقالي يصل من اليمين لليسار</p><section id="lobby" class="panel"><h2>العب مع أصحابك</h2><button onclick="send({type:'create'})">إنشاء غرفة</button><p>أو ادخل كود غرفة صديقك</p><input id="code" maxlength="6" placeholder="كود الغرفة"><button onclick="send({type:'join',code:document.getElementById('code').value})">دخول</button></section><section id="game" class="hidden"><div class="panel"><strong>رمز الغرفة: <span id="roomCode"></span></strong> <button onclick="copyInvite()">نسخ رابط الدعوة</button><p id="role"></p><small id="players"></small></div><div id="board" class="board"></div><div id="questionBox" class="panel hidden"><h2 id="letter"></h2><p id="question"></p><button id="revealBtn" onclick="document.getElementById('answer').classList.remove('hidden')">عرض الإجابة</button><p id="answer" class="answer hidden"></p><div id="hostControls"><button onclick="send({type:'claim',team:'g'})">🟢 للأخضر</button><button onclick="send({type:'claim',team:'o'})">🟠 للبرتقالي</button><button onclick="send({type:'next'})">سؤال آخر</button><button onclick="send({type:'close'})">إغلاق</button></div></div><p id="result"></p><button id="reset" onclick="send({type:'reset'})">لعبة جديدة</button></section><p id="notice"></p><small>صنع بدر خالد العصفور • المضيف يتحكم بالأسئلة وتلوين اللوحة، والجميع يشاهد التحديثات فورًا.</small></main><script>
let ws,db,latest,ready=false;const notice=document.getElementById('notice');fetch('/questions.json').then(r=>r.json()).then(x=>{db=x;ready=true;connect()}).catch(()=>notice.textContent='تعذر تحميل الأسئلة');
function connect(){ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host);ws.onopen=()=>{notice.textContent='متصل';const code=new URLSearchParams(location.search).get('room');if(code)send({type:'join',code})};ws.onclose=()=>{notice.textContent='انقطع الاتصال. أعد تحميل الصفحة للاتصال من جديد.'};ws.onmessage=e=>{let x=JSON.parse(e.data);if(x.type==='error'){notice.textContent=x.message;return}if(x.type==='state'){latest=x;render()}}}
function send(x){if(!ready||!ws||ws.readyState!==1){notice.textContent='انتظر الاتصال بالخادم';return}ws.send(JSON.stringify(x))}
function copyInvite(){let url=location.origin+location.pathname+'?room='+latest.code;if(navigator.clipboard?.writeText)navigator.clipboard.writeText(url).then(()=>notice.textContent='تم نسخ رابط الدعوة').catch(()=>prompt('انسخ الرابط',url));else prompt('انسخ الرابط',url)}
function render(){let s=latest;document.getElementById('lobby').classList.add('hidden');document.getElementById('game').classList.remove('hidden');document.getElementById('roomCode').textContent=s.code;document.getElementById('role').textContent=s.host?'أنت المضيف وتتحكم باللعبة':'أنت مشارك وتتابع اللوحة مباشرة';document.getElementById('players').textContent='المتصلون: '+s.players;document.getElementById('reset').style.display=s.host?'inline-block':'none';let board=document.getElementById('board');board.innerHTML='';for(let i=0;i<25;i++){let b=document.createElement('button');b.className='tile '+(s.cells[i]||'')+(s.selected===i?' active':'');b.textContent=s.letters[i];b.disabled=!s.host||!!s.cells[i]||!!s.winner;b.onclick=()=>send({type:'select',i});board.appendChild(b)}
let qbox=document.getElementById('questionBox');qbox.classList.toggle('hidden',s.selected===null);if(s.selected!==null){let i=s.selected,item=db.bank.filter(x=>x.letter===s.letters[i])[s.questionIndex[i]];document.getElementById('letter').textContent='حرف '+s.letters[i];document.getElementById('question').textContent=item.q;document.getElementById('answer').textContent='الإجابة: '+item.a;document.getElementById('answer').classList.add('hidden')}document.getElementById('hostControls').style.display=s.host?'block':'none';document.getElementById('result').textContent=s.winner?'🎉 الفريق '+(s.winner==='g'?'الأخضر':'البرتقالي')+'\nألف مبروك الفوز\nيا الذكي\nجولة جديدة بعد 6 ثوانٍ':s.cells.every(Boolean)?'انتهت اللوحة بالتعادل':''}
</script></body></html>
